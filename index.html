<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAK BEAUTY STUDIO</title>
    
    <!-- Официальный скрипт Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#0f0e0d',
                            card: '#181615',
                            gold: '#c5a059',
                            goldHover: '#d4af37',
                            textMuted: '#9e9892'
                        }
                    },
                    fontFamily: {
                        serif: ['"Cormorant Garamond"', 'serif'],
                        sans: ['Montserrat', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        .glass-panel {
            background: rgba(24, 22, 21, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(197, 160, 89, 0.2);
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #c5a059; border-radius: 4px; }
    </style>
</head>
<body class="bg-brand-dark text-gray-200 font-sans antialiased pb-24 selection:bg-brand-gold selection:text-black">

    <!-- Mobile-optimized Top Header -->
    <header class="sticky top-0 z-40 glass-panel px-4 py-3 flex items-center justify-between border-b border-brand-gold/20">
        <div>
            <h1 class="font-serif text-xl font-bold text-white tracking-wider">MAK BEAUTY</h1>
            <p class="text-[9px] text-brand-gold uppercase tracking-[0.2em] -mt-1">ул. Челюскинцев, 37</p>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="openMyBookingsModal()" class="text-xs border border-brand-gold/40 text-brand-gold px-3 py-1.5 rounded-full uppercase tracking-wider">Мои записи</button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-md mx-auto p-4 space-y-6">
        
        <!-- Welcome Banner -->
        <div class="glass-panel p-5 rounded-3xl text-center relative overflow-hidden border border-brand-gold/30">
            <div class="absolute -right-6 -bottom-6 w-24 h-24 bg-brand-gold/10 rounded-full blur-xl"></div>
            <span class="text-[10px] uppercase tracking-[0.3em] text-brand-gold font-semibold">Студия красоты</span>
            <h2 class="font-serif text-2xl text-white mt-1 mb-2">Онлайн-запись в один клик</h2>
            <p class="text-xs text-brand-textMuted leading-relaxed mb-4">Выберите услугу и мастера, подстроимся под ваш график.</p>
            <button onclick="openBookingModal()" class="w-full bg-brand-gold hover:bg-brand-goldHover text-black py-3 rounded-2xl font-semibold text-xs uppercase tracking-widest transition-all shadow-lg shadow-brand-gold/20">
                Выбрать процедуру
            </button>
        </div>

        <!-- Category Tabs -->
        <div>
            <div class="flex gap-2 overflow-x-auto pb-2 custom-scrollbar">
                <button onclick="filterServices('all')" class="service-tab-btn active bg-brand-gold text-black px-4 py-2 rounded-full text-xs uppercase font-semibold whitespace-nowrap">Все</button>
                <button onclick="filterServices('hair')" class="service-tab-btn bg-brand-card text-white border border-brand-gold/20 px-4 py-2 rounded-full text-xs uppercase whitespace-nowrap">Волосы</button>
                <button onclick="filterServices('nails')" class="service-tab-btn bg-brand-card text-white border border-brand-gold/20 px-4 py-2 rounded-full text-xs uppercase whitespace-nowrap">Ногти</button>
                <button onclick="filterServices('brows')" class="service-tab-btn bg-brand-card text-white border border-brand-gold/20 px-4 py-2 rounded-full text-xs uppercase whitespace-nowrap">Брови</button>
            </div>
        </div>

        <!-- Services List Grid -->
        <div id="services-container" class="space-y-3"></div>

        <!-- Masters Quick View -->
        <div class="pt-4">
            <h3 class="text-xs uppercase tracking-widest text-brand-gold font-semibold mb-3">Наши мастера</h3>
            <div class="grid grid-cols-3 gap-3">
                <div onclick="openBookingModal('Анна')" class="glass-panel p-3 rounded-2xl text-center cursor-pointer hover:border-brand-gold transition-all">
                    <div class="w-12 h-12 mx-auto rounded-full bg-neutral-900 border border-brand-gold/40 flex items-center justify-center font-serif text-lg text-brand-gold mb-2">А</div>
                    <div class="text-xs font-bold text-white">Анна</div>
                    <div class="text-[9px] text-brand-textMuted">Волосы</div>
                </div>
                <div onclick="openBookingModal('Катя')" class="glass-panel p-3 rounded-2xl text-center cursor-pointer hover:border-brand-gold transition-all">
                    <div class="w-12 h-12 mx-auto rounded-full bg-neutral-900 border border-brand-gold/40 flex items-center justify-center font-serif text-lg text-brand-gold mb-2">К</div>
                    <div class="text-xs font-bold text-white">Катя</div>
                    <div class="text-[9px] text-brand-textMuted">Волосы</div>
                </div>
                <div onclick="openBookingModal('Марина')" class="glass-panel p-3 rounded-2xl text-center cursor-pointer hover:border-brand-gold transition-all">
                    <div class="w-12 h-12 mx-auto rounded-full bg-neutral-900 border border-brand-gold/40 flex items-center justify-center font-serif text-lg text-brand-gold mb-2">М</div>
                    <div class="text-xs font-bold text-white">Марина</div>
                    <div class="text-[9px] text-brand-textMuted">Ногти/Брови</div>
                </div>
            </div>
        </div>
    </main>

    <!-- Fixed Bottom Action Bar for Mobile -->
    <div class="fixed bottom-0 left-0 right-0 glass-panel p-3 border-t border-brand-gold/20 flex gap-3 max-w-md mx-auto z-40">
        <button onclick="openAdminModal()" class="w-12 h-12 rounded-2xl bg-brand-card border border-brand-gold/30 text-brand-gold flex items-center justify-center text-lg" title="Панель мастера">⚙</button>
        <button onclick="openBookingModal()" class="flex-1 bg-brand-gold hover:bg-brand-goldHover text-black font-bold py-3 rounded-2xl text-xs uppercase tracking-widest shadow-lg shadow-brand-gold/20 transition-all">
            Записаться онлайн
        </button>
    </div>

    <!-- Booking Modal -->
    <div id="booking-modal" class="fixed inset-0 z-50 hidden bg-black/90 backdrop-blur-md flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="glass-panel w-full max-w-lg rounded-t-3xl sm:rounded-3xl p-6 max-h-[90vh] flex flex-col overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-serif text-2xl text-white">Оформление записи</h3>
                <button onclick="closeBookingModal()" class="text-gray-400 hover:text-white text-xl">✕</button>
            </div>

            <form id="booking-form" onsubmit="handleBookingSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-[10px] uppercase tracking-widest text-brand-gold font-semibold mb-2">Выберите услуги:</label>
                    <div id="modal-services-list" class="space-y-2 max-h-40 overflow-y-auto custom-scrollbar pr-1"></div>
                </div>

                <div class="p-3 bg-brand-dark/90 rounded-xl border border-brand-gold/30 flex justify-between items-center text-xs">
                    <div><span class="text-brand-textMuted">Итого:</span> <span id="selected-price" class="text-brand-gold font-bold text-base">0 BYN</span></div>
                    <div><span class="text-brand-textMuted">Время:</span> <span id="selected-duration" class="text-white font-medium">0 мин</span></div>
                </div>

                <div>
                    <label class="block text-[10px] uppercase tracking-widest text-brand-gold font-semibold mb-1">Мастер:</label>
                    <select id="master-select" onchange="renderTimeSlots()" required class="w-full bg-brand-dark border border-brand-gold/30 rounded-xl p-3 text-white text-xs">
                        <option value="">-- Выберите мастера --</option>
                    </select>
                </div>

                <div>
                    <label class="block text-[10px] uppercase tracking-widest text-brand-gold font-semibold mb-1">Дата:</label>
                    <input type="date" id="booking-date" onchange="renderTimeSlots()" required class="w-full bg-brand-dark border border-brand-gold/30 rounded-xl p-3 text-white text-xs">
                </div>

                <div>
                    <label class="block text-[10px] uppercase tracking-widest text-brand-gold font-semibold mb-2">Окно времени:</label>
                    <div id="time-slots-container" class="grid grid-cols-3 gap-2"></div>
                    <input type="hidden" id="selected-time-slot">
                </div>

                <div class="space-y-2 pt-2">
                    <input type="text" id="client-name" placeholder="Ваше имя" required class="w-full bg-brand-dark border border-brand-gold/30 rounded-xl p-3 text-white text-xs">
                    <input type="tel" id="client-phone" placeholder="+375 (XX) XXX-XX-XX" required class="w-full bg-brand-dark border border-brand-gold/30 rounded-xl p-3 text-white text-xs">
                </div>

                <button type="submit" class="w-full bg-brand-gold hover:bg-brand-goldHover text-black font-bold py-3.5 rounded-xl text-xs uppercase tracking-widest transition-all">
                    Отправить заявку
                </button>
            </form>
        </div>
    </div>

    <!-- My Bookings Modal -->
    <div id="my-bookings-modal" class="fixed inset-0 z-50 hidden bg-black/90 backdrop-blur-md flex items-center justify-center p-4">
        <div class="glass-panel w-full max-w-md rounded-3xl p-6 relative">
            <button onclick="closeMyBookingsModal()" class="absolute top-6 right-6 text-gray-400 hover:text-white text-xl">✕</button>
            <h3 class="font-serif text-2xl text-white mb-2">Мои записи</h3>
            <div class="flex gap-2 mb-4">
                <input type="tel" id="lookup-phone" placeholder="+375..." class="w-full bg-brand-dark border border-brand-gold/30 rounded-xl p-3 text-white text-xs">
                <button onclick="lookupBookings()" class="bg-brand-gold text-black px-4 py-3 rounded-xl font-bold text-xs">Найти</button>
            </div>
            <div id="my-bookings-list" class="space-y-2 max-h-60 overflow-y-auto"></div>
        </div>
    </div>

    <!-- Admin Panel Modal -->
    <div id="admin-modal" class="fixed inset-0 z-50 hidden bg-black/90 backdrop-blur-md flex items-center justify-center p-4">
        <div class="glass-panel w-full max-w-md rounded-3xl p-6 relative">
            <button onclick="closeAdminModal()" class="absolute top-6 right-6 text-gray-400 hover:text-white text-xl">✕</button>
            <h3 class="font-serif text-2xl text-white mb-2">Панель мастера</h3>
            <form onsubmit="saveMasterSchedule(event)" class="space-y-3">
                <select id="admin-master" required class="w-full bg-brand-dark border border-brand-gold/30 rounded-xl p-3 text-white text-xs">
                    <option value="Анна">Анна</option>
                    <option value="Катя">Катя</option>
                    <option value="Марина">Марина</option>
                </select>
                <input type="date" id="admin-date" required class="w-full bg-brand-dark border border-brand-gold/30 rounded-xl p-3 text-white text-xs">
                <button type="submit" class="w-full bg-brand-gold text-black font-bold py-3 rounded-xl text-xs uppercase">Поставить выходной</button>
            </form>
        </div>
    </div>

    <!-- Core JS -->
    <script>
        const ADMIN_PIN = "1234";
        const TELEGRAM_BOT_TOKEN = "9228881842:AAGxbfe2YzULhtz6wNFtQ2QilRiHK6oUwWs";
        const TELEGRAM_CHAT_ID = "5070882729";

        const tg = window.Telegram.WebApp;
        try { tg.expand(); } catch(e) {}

        const servicesData = [
            { id: 1, category: 'hair', name: 'Женская стрижка и укладка', price: 45, duration: 60, masters: ['Анна', 'Катя'] },
            { id: 2, category: 'hair', name: 'Сложное окрашивание (Airtouch)', price: 120, duration: 180, masters: ['Анна', 'Катя'] },
            { id: 3, category: 'nails', name: 'Комплекс Маникюр + Гель-лак', price: 40, duration: 90, masters: ['Марина'] },
            { id: 4, category: 'nails', name: 'Эстетический Педикюр', price: 50, duration: 90, masters: ['Марина'] },
            { id: 5, category: 'brows', name: 'Коррекция и окрашивание бровей', price: 25, duration: 45, masters: ['Марина'] }
        ];

        let activeBookings = [];
        let masterSchedules = [];
        let selectedServiceIds = [];

        function renderServices(filter = 'all') {
            const container = document.getElementById('services-container');
            container.innerHTML = '';
            const filtered = filter === 'all' ? servicesData : servicesData.filter(s => s.category === filter);

            filtered.forEach(s => {
                container.innerHTML += `
                    <div class="glass-panel p-4 rounded-2xl flex items-center justify-between">
                        <div>
                            <h4 class="font-serif text-base text-white">${sanitizeHTML(s.name)}</h4>
                            <p class="text-[10px] text-brand-textMuted">~${s.duration} мин • ${s.masters.join(', ')}</p>
                        </div>
                        <div class="text-right">
                            <span class="text-brand-gold font-bold text-sm block mb-1">${s.price} BYN</span>
                            <button onclick="openBookingWithService(${s.id})" class="bg-brand-gold/20 hover:bg-brand-gold text-brand-gold hover:text-black border border-brand-gold/40 px-3 py-1 rounded-xl text-[10px] uppercase font-semibold transition-all">Выбрать</button>
                        </div>
                    </div>
                `;
            });
        }

        function filterServices(cat) {
            document.querySelectorAll('.service-tab-btn').forEach(b => {
                b.classList.remove('bg-brand-gold', 'text-black');
                b.classList.add('bg-brand-card', 'text-white');
            });
            event.target.classList.remove('bg-brand-card', 'text-white');
            event.target.classList.add('bg-brand-gold', 'text-black');
            renderServices(cat);
        }

        function renderTimeSlots() {
            const container = document.getElementById('time-slots-container');
            const dateVal = document.getElementById('booking-date').value;
            const masterVal = document.getElementById('master-select').value;
            container.innerHTML = '';
            document.getElementById('selected-time-slot').value = '';

            if (!dateVal || !masterVal) {
                container.innerHTML = '<span class="col-span-3 text-[10px] text-brand-textMuted italic">Выберите мастера и дату</span>';
                return;
            }

            const schedule = masterSchedules.find(s => s.master === masterVal && s.date === dateVal);
            if (schedule && schedule.isDayOff) {
                container.innerHTML = '<span class="col-span-3 text-[10px] text-rose-400 font-semibold">У мастера выходной</span>';
                return;
            }

            ['10:00', '12:00', '14:00', '16:00', '18:00'].forEach(t => {
                const isTaken = activeBookings.some(b => b.master === masterVal && b.date === dateVal && b.time === t);
                const btn = document.createElement('button');
                btn.type = 'button';
                if (isTaken) {
                    btn.className = 'p-2 rounded-xl bg-rose-950/20 border border-rose-500/30 text-rose-400 text-[11px]';
                    btn.disabled = true;
                    btn.innerText = `${t} (Зан.)`;
                } else {
                    btn.className = 'slot-btn p-2 rounded-xl bg-emerald-950/20 border border-emerald-500/30 text-emerald-300 text-[11px] hover:bg-emerald-500/30';
                    btn.onclick = () => selectSlot(t, btn);
                    btn.innerText = t;
                }
                container.appendChild(btn);
            });
        }

        function selectSlot(time, element) {
            document.querySelectorAll('.slot-btn').forEach(b => {
                b.classList.remove('bg-brand-gold', 'text-black', 'border-brand-gold');
            });
            element.classList.add('bg-brand-gold', 'text-black', 'border-brand-gold');
            document.getElementById('selected-time-slot').value = time;
        }

        function openBookingModal(preselectedMaster = null) {
            document.getElementById('booking-modal').classList.remove('hidden');
            renderModalServices();
            updateMasterDropdown(preselectedMaster);
            try {
                if (tg.initDataUnsafe?.user?.first_name) {
                    document.getElementById('client-name').value = tg.initDataUnsafe.user.first_name;
                }
            } catch(e){}
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('booking-date').min = today;
            document.getElementById('booking-date').value = today;
            renderTimeSlots();
        }

        function openBookingWithService(id) { selectedServiceIds = [id]; openBookingModal(); }
        function closeBookingModal() { document.getElementById('booking-modal').classList.add('hidden'); selectedServiceIds = []; }

        function renderModalServices() {
            const list = document.getElementById('modal-services-list');
            list.innerHTML = '';
            servicesData.forEach(s => {
                const checked = selectedServiceIds.includes(s.id) ? 'checked' : '';
                list.innerHTML += `
                    <label class="flex items-center justify-between p-2.5 rounded-xl bg-brand-dark/50 border border-brand-gold/10 cursor-pointer text-xs">
                        <div class="flex items-center gap-2">
                            <input type="checkbox" value="${s.id}" ${checked} onchange="toggleServiceSelection(${s.id})" class="accent-brand-gold">
                            <span class="text-white">${sanitizeHTML(s.name)}</span>
                        </div>
                        <span class="text-brand-gold font-semibold">${s.price} BYN</span>
                    </label>
                `;
            });
            calculateTotals();
        }

        function toggleServiceSelection(id) {
            selectedServiceIds.includes(id) ? selectedServiceIds = selectedServiceIds.filter(i => i !== id) : selectedServiceIds.push(id);
            calculateTotals();
            updateMasterDropdown();
            renderTimeSlots();
        }

        function calculateTotals() {
            const sel = servicesData.filter(s => selectedServiceIds.includes(s.id));
            document.getElementById('selected-price').innerText = `${sel.reduce((a,b)=>a+b.price,0)} BYN`;
            document.getElementById('selected-duration').innerText = `${sel.reduce((a,b)=>a+b.duration,0)} мин`;
        }

        function updateMasterDropdown(forced = null) {
            const select = document.getElementById('master-select');
            select.innerHTML = '<option value="">-- Выберите мастера --</option>';
            let masters = ['Анна', 'Катя', 'Марина'];
            const sel = servicesData.filter(s => selectedServiceIds.includes(s.id));
            if (sel.length > 0) masters = sel.map(s => s.masters).reduce((a,b) => a.filter(c => b.includes(c)));
            masters.forEach(m => {
                select.innerHTML += `<option value="${m}" ${forced===m?'selected':''}>${m}</option>`;
            });
        }

        function sanitizeHTML(str) {
            const div = document.createElement('div'); div.textContent = str; return div.innerHTML;
        }

        function handleBookingSubmit(e) {
            e.preventDefault();
            if (selectedServiceIds.length === 0) { alert('Выберите услугу.'); return; }
            const timeSlot = document.getElementById('selected-time-slot').value;
            if (!timeSlot) { alert('Выберите время.'); return; }

            const booking = {
                id: Date.now(),
                master: document.getElementById('master-select').value,
                date: document.getElementById('booking-date').value,
                time: timeSlot,
                client: sanitizeHTML(document.getElementById('client-name').value),
                phone: document.getElementById('client-phone').value.replace(/[\s\()-]/g, ''),
                serviceNames: servicesData.filter(s => selectedServiceIds.includes(s.id)).map(s => s.name).join(', ')
            };

            activeBookings.push(booking);

            // Отправка в ТГ с кнопками Подтвердить / Отклонить
            fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: `✨ *Новая заявка через Mini App!*\n\n👤 *Имя:* ${booking.client}\n📞 *Телефон:* ${booking.phone}\n👩‍🦰 *Мастер:* ${booking.master}\n📅 *Дата:* ${booking.date}\n⏰ *Время:* ${booking.time}\n💅 *Услуги:* ${booking.serviceNames}`,
                    parse_mode: 'Markdown',
                    reply_markup: {
                        inline_keyboard: [
                            [
                                { text: "✅ Подтвердить", callback_data: `confirm_${booking.id}` },
                                { text: "❌ Отклонить", callback_data: `cancel_${booking.id}` }
                            ]
                        ]
                    }
                })
            }).catch(err => console.error(err));

            alert(`Спасибо, ${booking.client}! Заявка отправлена мастеру.`);
            closeBookingModal();
            try { tg.close(); } catch(e){}
        }

        function openAdminModal() { if(prompt("PIN:")===ADMIN_PIN) document.getElementById('admin-modal').classList.remove('hidden'); }
        function closeAdminModal() { document.getElementById('admin-modal').classList.add('hidden'); }
        function saveMasterSchedule(e) {
            e.preventDefault();
            masterSchedules.push({ master: document.getElementById('admin-master').value, date: document.getElementById('admin-date').value, isDayOff: true });
            alert('Выходной сохранен!'); closeAdminModal();
        }

        function openMyBookingsModal() { document.getElementById('my-bookings-modal').classList.remove('hidden'); }
        function closeMyBookingsModal() { document.getElementById('my-bookings-modal').classList.add('hidden'); }
        function lookupBookings() {
            const phone = document.getElementById('lookup-phone').value.replace(/[\s\()-]/g, '');
            const list = document.getElementById('my-bookings-list'); list.innerHTML = '';
            const found = activeBookings.filter(b => b.phone.includes(phone));
            if(found.length === 0) { list.innerHTML = '<p class="text-xs text-brand-textMuted">Записей нет.</p>'; return; }
            found.forEach(b => {
                list.innerHTML += `<div class="p-3 bg-brand-dark rounded-xl text-xs text-white border border-brand-gold/20"><b>${b.master}</b> • ${b.date} в ${b.time}<br>${b.serviceNames}</div>`;
            });
        }

        document.addEventListener('DOMContentLoaded', () => { renderServices('all'); });
    </script>
</body>
</html>
